name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x, 22.x]
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check file sizes
        run: pnpm run check:size

      - name: Run tests
        run: pnpm test

      - name: Run root-level script tests (e.g. check-commit-message)
        run: pnpm exec vitest run scripts/

      - name: Validate commit message convention
        # Permissive validator — only intervenes when a commit subject's scope
        # looks task-shaped (e.g. `fix(190.16.42):`). See
        # `.claude/rules/commit-convention.md`.
        run: node --import tsx scripts/check-commit-message.ts --ci

      - name: Check packages
        run: |
          pnpm --filter @ariadnejs/types pack --pack-destination /tmp
          pnpm --filter @ariadnejs/core pack --pack-destination /tmp
          pnpm --filter @ariadnejs/mcp pack --pack-destination /tmp