name: Test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
        node-version: [20.x, 22.x]
        
    steps:
      - uses: actions/checkout@v4
      
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Check file sizes
        run: pnpm run check:size

      - name: Check permanent rules slice + builtins barrel are in sync
        # Regenerates `packages/core/src/classify_entry_points/permanent_data.ts`
        # and `builtins/index.ts` from the skill registry, then asserts a clean
        # diff. Catches drift between the registry and the bundled core slice.
        run: pnpm run check-permanent-rules

      - name: Check mermaid diagrams are in sync with sources
        # Pure-Node SHA256 verification. No Chrome required at check time. Fails
        # when any `.mmd` source is edited without regenerating its sibling
        # `.svg` via `pnpm render-mermaid-diagrams`. See
        # `backlog/tasks/task-345 - ...md` for the workflow.
        run: pnpm run check-mermaid-diagrams

      - name: Run tests
        run: pnpm test

      - name: Run root-level script tests (e.g. check-commit-message)
        run: pnpm exec vitest run scripts/

      - name: Validate commit message convention
        # Permissive validator — only intervenes when a commit subject's scope
        # looks task-shaped (e.g. `fix(190.16.42):`). See
        # `.claude/rules/commit-convention.md`.
        run: node --import tsx scripts/check-commit-message.ts --ci

      - name: Check packages
        run: |
          pnpm --filter @ariadnejs/types pack --pack-destination /tmp
          pnpm --filter @ariadnejs/core pack --pack-destination /tmp
          pnpm --filter @ariadnejs/mcp pack --pack-destination /tmp